<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMBINATORICS.exe — LEADERBOARD</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="sabotage.css">
</head>
<body class="lb-body">
  <div class="lb-shell">
    <header class="lb-header">
      <div>
        <div class="logo">COMBINATORICS.exe // LIVE RANKING</div>
        <div id="phase" class="phase">LOBBY</div>
      </div>
      <div class="lb-qr-wrap">
        <div id="qr" class="qr hidden"></div>
        <div id="clock" class="clock">--:--</div>
      </div>
    </header>

    <div class="panel" style="margin-bottom:14px">
      <div id="info" class="small" style="text-align:center">Učitavanje...</div>
    </div>

    <div class="panel" style="margin-bottom:14px">
      <div class="kicker">Uživo // sabotaže</div>
      <div id="feed"></div>
    </div>

    <div class="panel">
      <table>
        <thead>
          <tr>
            <th style="width:60px">#</th>
            <th>TIM</th>
            <th style="width:200px">ZADACI</th>
            <th style="width:100px">POENI</th>
            <th style="width:120px">VREME</th>
            <th style="width:90px">POKUŠaji</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="6" class="small">Čekamo timove...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="qrcode.min.js"></script>
  <script type="module" src="leaderboard.js"></script>
</body>
</html>
