<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kombinatorika: rang-lista</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="lb-body">
  <div class="lb-shell">
    <header class="lb-header">
      <div>
        <div class="logo">Rang-lista</div>
        <div id="phase" class="phase">Čekanje</div>
      </div>
      <div class="lb-qr-wrap">
        <div id="qr" class="qr hidden"></div>
        <div id="clock" class="clock">--:--</div>
      </div>
    </header>

    <div class="panel" style="margin-bottom:14px">
      <div id="info" class="small">Učitavanje…</div>
    </div>

    <div class="panel" style="margin-bottom:14px">
      <h2>Sabotaže uživo</h2>
      <div id="feed"></div>
    </div>

    <div class="panel">
      <table>
        <thead>
          <tr>
            <th style="width:60px">#</th>
            <th>Tim</th>
            <th style="width:200px">Zadaci</th>
            <th style="width:100px">Poeni</th>
            <th style="width:120px">Vreme</th>
            <th style="width:100px">Pokušaji</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="6" class="small">Čekamo timove…</td></tr>
        </tbody>
      </table>
      <p class="small" style="margin:12px 0 0">Rangiranje: poeni, pa broj rešenih zadataka, pa manje pogrešnih pokušaja, pa ko je ranije završio.</p>
    </div>
  </div>

  <script src="qrcode.min.js"></script>
  <script type="module" src="leaderboard.js"></script>
</body>
</html>
